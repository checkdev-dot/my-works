<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Mode desk</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<a class="skip" href="#main">Skip to shelves</a>
<header class="top" id="top">
  <a class="word" href="#home" aria-label="TV Mode, home">TV Mode</a>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button class="tab" type="button" data-view="home">Home</button>
    <button class="tab" type="button" data-view="library">Library</button>
    <button class="tab" type="button" data-view="watched">Watched</button>
    <button class="tab" type="button" data-view="year">Your year<i class="dot" id="yearDot" hidden></i></button>
  </nav>
  <p class="apill off" id="appsPill" aria-hidden="true"></p>
  <div class="sbox" id="sbox">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="search" placeholder="Search titles" autocomplete="off" spellcheck="false" aria-label="Search movies and series">
      <kbd aria-hidden="true">/</kbd>
      <span class="enterhint" id="enterHint" aria-hidden="true" hidden>Enter opens the first</span>
    </label>
    <div class="recent" id="recent" hidden></div>
  </div>
  <div class="right">
    <div class="tvctl" id="tvctl" role="group" aria-label="TV" data-st="off">
      <span class="tvs"><i aria-hidden="true"></i><b id="tvWord">TV off</b></span>
      <button class="tvgo" id="tvGo" type="button">Start TV</button>
      <button class="tvoff" id="tvOff" type="button" hidden>Turn TV off</button>
    </div>
    <span class="phone" id="phone" role="status" title="No phone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/><path class="slash" d="M3.5 3.5l17 17"/></svg><span id="phoneTxt">No phone</span></span>
    <span class="clock" id="clock" aria-label="Time">--:--</span>
    <div class="set" id="set">
      <button class="iconbtn" id="setBtn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="cityForm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
      <form class="pop" id="cityForm" hidden>
        <label for="cityIn">Your city</label>
        <input id="cityIn" type="text" autocomplete="off" spellcheck="false" maxlength="60" placeholder="Mumbai">
        <p class="citysum" id="citySum">Weather off</p>
        <div class="cityacts"><button class="btn sm" id="citySave" type="submit">Save</button><button class="btn sm" id="cityOff" type="button" hidden>Remove</button></div>
        <p class="citynote" id="cityNote" role="status">Rain, heat and cold then shape tonight's picks a little. The city is kept on this PC only.</p>
      </form>
    </div>
  </div>
</header>

<nav class="apps" id="apps" aria-label="Apps">
  <div class="tile" data-svc="jiohotstar">
    <button class="topen" type="button" data-app="jiohotstar" title="Open JioHotstar here" aria-label="Open JioHotstar here">
      <svg viewBox="0 0 240 64" aria-hidden="true"><path d="M36 10l4.5 12.5L53 27l-12.5 4.5L36 44l-4.5-12.5L19 27l12.5-4.5z" fill="currentColor"/><text x="66" y="42" font-size="30" font-weight="700" fill="currentColor" font-family="Segoe UI,Arial,sans-serif" letter-spacing="-.5">JioHotstar</text></svg>
    </button>
    <button class="ton" type="button" data-app="jiohotstar" title="Opens JioHotstar on the TV. If the TV is off, it starts first (about half a minute)" aria-label="Open JioHotstar on TV">On TV</button>
  </div>
  <div class="tile" data-svc="prime">
    <button class="topen" type="button" data-app="prime" title="Open Prime Video here" aria-label="Open Prime Video here">
      <svg viewBox="0 0 240 64" aria-hidden="true"><text x="120" y="36" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" font-family="Segoe UI,Arial,sans-serif">prime video</text><path d="M62 46q58 14 112 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
    </button>
    <button class="ton" type="button" data-app="prime" title="Opens Prime Video on the TV. If the TV is off, it starts first (about half a minute)" aria-label="Open Prime Video on TV">On TV</button>
  </div>
  <div class="tile" data-svc="netflix">
    <button class="topen" type="button" data-app="netflix" title="Open Netflix here" aria-label="Open Netflix here">
      <svg viewBox="0 0 240 64" aria-hidden="true"><text x="120" y="45" text-anchor="middle" font-size="40" font-weight="800" fill="currentColor" font-family="Bahnschrift Condensed,Arial Narrow,Segoe UI,sans-serif" letter-spacing="3">NETFLIX</text></svg>
    </button>
    <button class="ton" type="button" data-app="netflix" title="Opens Netflix on the TV. If the TV is off, it starts first (about half a minute)" aria-label="Open Netflix on TV">On TV</button>
  </div>
  <div class="tile" data-svc="youtube">
    <button class="topen" type="button" data-app="youtube" title="Open YouTube here" aria-label="Open YouTube here">
      <svg viewBox="0 0 240 64" aria-hidden="true"><rect x="40" y="14" width="44" height="32" rx="9" fill="currentColor"/><path d="M57 22v16l14-8z" fill="#141414"/><text x="94" y="42" font-size="30" font-weight="700" fill="currentColor" font-family="Segoe UI,Arial,sans-serif" letter-spacing="-.5">YouTube</text></svg>
    </button>
    <button class="ton" type="button" data-app="youtube" title="Opens YouTube on the TV. If the TV is off, it starts first (about half a minute)" aria-label="Open YouTube on TV">On TV</button>
  </div>
</nav>

<main id="main" tabindex="-1">
  <h1 class="sr">TV Mode at your desk</h1>
  <section id="home" aria-label="Home">
    <section class="stage" id="hero" aria-label="Featured"></section>
    <div class="chiplab" id="chipLab">Show titles from</div>
    <div class="chips" id="chipsHome" role="group" aria-label="Show titles from"></div>
    <div id="rows"></div>
  </section>
  <section id="page" class="page" hidden></section>
</main>

<aside id="panel" class="panel" aria-label="Details" hidden></aside>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="desk.js"></script>
</body>
</html>
